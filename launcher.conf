# ── Rally-Racing launcher configuration ──────────────────────────────────────
# Edit VENV_PATH to point at the Python virtual environment that has the
# project dependencies installed (the one created by setup.sh, or your own).
#
# This single file is read by both setup.sh and launch.sh, so the venv location
# is defined in exactly one place. If you move your venv, change only this line.
#
# Example: VENV_PATH=/home/$USER/Git/venv

VENV_PATH=/home/alec/Git/RallySimVenv

# Optional: override the Python used to CREATE the venv in setup.sh.
# Leave as python3 unless you need a specific interpreter (e.g. python3.10).
BOOTSTRAP_PYTHON=python3
